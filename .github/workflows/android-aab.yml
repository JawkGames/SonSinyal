name: Android AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Surum bilgisi
        run: |
          SURUM=$(grep -o "surum: '[^']*'" www/js/config.js | sed "s/surum: '//;s/'//")
          echo "SURUM_AD=${SURUM#v}" >> $GITHUB_ENV
          echo "SURUM_KODU=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Imza anahtari
        env:
          KS_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > son-sinyal.keystore
            echo "KS_SIFRE=${{ secrets.UPLOAD_KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "KS_TAKMA=upload" >> $GITHUB_ENV
            echo "IMZA=gercek" >> $GITHUB_ENV
          else
            echo "::warning::KEYSTORE_BASE64 secret yok; gecici anahtar uretiliyor (Play'e yuklenemez/guncellenemez)."
            keytool -genkeypair -v -keystore son-sinyal.keystore -alias gecici -keyalg RSA -keysize 2048 -validity 10000 -storepass gecici123 -keypass gecici123 -dname "CN=Son Sinyal, O=JAWK, C=TR"
            echo "KS_SIFRE=gecici123" >> $GITHUB_ENV
            echo "KS_TAKMA=gecici" >> $GITHUB_ENV
            echo "IMZA=gecici" >> $GITHUB_ENV
          fi
          echo "KS_DOSYA=$GITHUB_WORKSPACE/son-sinyal.keystore" >> $GITHUB_ENV

      - name: Capacitor Android projesi
        run: |
          npm install
          npx cap add android
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0a0f16' --iconBackgroundColorDark '#0a0f16' --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000'
          python3 android-ayar/ayarla.py
          npx cap sync android

      - name: AAB uret
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v5
        with:
          name: son-sinyal-aab-${{ env.SURUM_AD }}-${{ env.IMZA }}
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: AAB'yi zipsiz indirilebilir surum olarak yayinla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AD="son-sinyal-${SURUM_AD}-${IMZA}.aab"
          cp android/app/build/outputs/bundle/release/app-release.aab "$AD"
          TAG="aab-${SURUM_AD}-${{ github.run_number }}"
          MAP=android/app/build/outputs/mapping/release/mapping.txt
          EK=""; if [ -f "$MAP" ]; then cp "$MAP" "son-sinyal-${SURUM_AD}-mapping.txt"; EK="son-sinyal-${SURUM_AD}-mapping.txt"; fi
          gh release create "$TAG" "$AD" $EK --title "Son Sinyal ${SURUM_AD} (AAB)" --notes "Play Console'a yuklenecek AAB (zipsiz). Imza: ${IMZA}" --prerelease
